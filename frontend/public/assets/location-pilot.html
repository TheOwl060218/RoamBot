<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RoamBot · 定位来源试用</title>
<style>
:root{color-scheme:light;font:16px/1.7 system-ui,sans-serif;color:#193e47;background:#edf5f4}*{box-sizing:border-box}body{margin:0;padding:32px 20px}main{max-width:800px;margin:5vh auto}h1{font-size:30px;line-height:1.3}h2{font-size:19px;margin-top:0}.muted{color:#59747b}.panels{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin:28px 0}section{background:white;border:1px solid #d9e7e7;border-radius:22px;padding:24px}button,a{font:inherit;color:inherit}button{border:0;background:#dceeed;border-radius:24px;padding:10px 18px;cursor:pointer}button:disabled{opacity:.55;cursor:default}button:focus-visible,a:focus-visible{outline:2px solid #27778a;outline-offset:4px}output{display:block;white-space:pre-line;min-height:180px;margin-top:20px;overflow-wrap:anywhere}#budget{font-size:13px;margin-top:12px}@media(max-width:580px){main{margin:16px auto}.panels{grid-template-columns:1fr}}
</style>
<main>
<a href="/explore">← 返回推荐</a><h1>定位来源试用</h1>
<p class="muted">比较设备定位与高德融合定位。结果只留在当前页面，不启动推荐或更改当前出发地。</p>
<p role="status">试验已结束：融合定位未返回位置；城市接口接线修正后补测返回江苏省南京市，约 0.22 秒。没有得到用户所在的苏州，未采用为主站默认位置。</p>
<div class="panels">
<section><h2>设备定位</h2><button type="button" id="device">获取设备位置</button><output id="device-result" aria-live="polite">等待获取</output></section>
<section><h2>高德定位</h2><button type="button" id="amap">试用高德融合定位</button> <button type="button" id="city">试用城市级定位</button><p class="muted" id="budget"></p><output id="amap-result" aria-live="polite">等待获取</output></section>
</div>
<p class="muted">只显示取整后的坐标。IP 来源只用于判断城市，不作为精确出发位置；设备结果是 WGS84，高德转换后结果是 GCJ‑02，小范围坐标差异不能直接比较。此试用不调用模型、搜索、路线或天气。</p>
</main>
<script>
const deviceButton=document.querySelector('#device'), amapButton=document.querySelector('#amap'),cityButton=document.querySelector('#city');
const budgetKey='roambot:location-pilot:20261024:attempts';
const experimentClosed=true;
let attempts=Math.max(2,Number(sessionStorage.getItem(budgetKey))||0), sdkPromise, busy=false;
const cap=2;
function refresh(){amapButton.disabled=experimentClosed||busy||attempts>=cap;cityButton.disabled=experimentClosed||busy||attempts>=cap;deviceButton.disabled=busy;document.querySelector('#budget').textContent='初试 2 / 2 次、补充验证 1 / 1 次均已结束，不自动重试';}
function rounded(lng,lat){return `东经 ${lng.toFixed(2)}°\n北纬 ${lat.toFixed(2)}°`;}
function code(value){return typeof value==='string'&&/^[A-Z_0-9]{1,80}$/.test(value)?value:'定位未完成';}
function safeMessage(value){return typeof value==='string'?value.replace(/https?:\/\/\S+/g,'[服务地址]').replace(/(?:key|jscode|scode)=[^&\s]+/gi,'[凭据]').slice(0,160):'定位未完成';}
async function deadline(promise,ms,label){let timer;try{return await Promise.race([promise,new Promise((_,reject)=>{timer=setTimeout(()=>reject(new Error(label)),ms);})]);}finally{clearTimeout(timer);}}
async function loadSdk(){
  if(sdkPromise)return sdkPromise;
  sdkPromise=(async()=>{
    const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),8000);
    let response;try{response=await fetch('/api/v1/maps/config',{signal:controller.signal,cache:'no-store'});}finally{clearTimeout(timer);}
    if(!response.ok)throw new Error('地图配置暂不可用');
    const config=await response.json();if(!config.enabled)throw new Error('尚未配置高德 JS 定位');
    const host=new URL(config.service_host,location.origin);if(host.origin!==location.origin)throw new Error('地图代理配置异常');
    window._AMapSecurityConfig={serviceHost:host.href};
    if(!window.AMap){
      await deadline(new Promise((resolve,reject)=>{const script=document.createElement('script');script.async=true;
        script.src='https://webapi.amap.com/maps?'+new URLSearchParams({v:'2.0',key:config.key,plugin:'AMap.Geolocation'});
        script.onload=()=>window.AMap?resolve():reject(new Error('高德 SDK 未就绪'));
        script.onerror=()=>reject(new Error('高德 SDK 加载失败'));document.head.append(script);
      }),12000,'高德 SDK 加载超时');
    }
    if(!window.AMap.Geolocation)await deadline(new Promise(resolve=>window.AMap.plugin('AMap.Geolocation',resolve)),8000,'定位插件加载超时');
    return window.AMap;
  })();return sdkPromise;
}
deviceButton.addEventListener('click',()=>{
  const output=document.querySelector('#device-result');if(!navigator.geolocation){output.textContent='当前浏览器未提供定位接口。';return;}
  busy=true;refresh();output.textContent='正在读取设备位置…';
  navigator.geolocation.getCurrentPosition(p=>{output.textContent=rounded(p.coords.longitude,p.coords.latitude)+`\n设备自报误差约 ${Math.round(p.coords.accuracy)} 米\n${new Date(p.timestamp).toLocaleTimeString('zh-CN')}`;busy=false;refresh();},e=>{output.textContent=e.code===1?'未获定位授权。':'设备定位未完成。';busy=false;refresh();},{enableHighAccuracy:true,maximumAge:0,timeout:12000});
});
amapButton.addEventListener('click',async()=>{
  if(experimentClosed||busy||attempts>=cap)return;
  attempts++;sessionStorage.setItem(budgetKey,String(attempts));busy=true;refresh();
  const output=document.querySelector('#amap-result'),started=performance.now();output.textContent='正在加载高德定位…';
  try{
    const sdk=await loadSdk();
    output.textContent='正在获取高德定位…';
    const service=new sdk.Geolocation({enableHighAccuracy:true,maximumAge:0,timeout:10000,GeoLocationFirst:false,
      needAddress:false,convert:true,showButton:false,showMarker:false,showCircle:false,panToLocation:false,zoomToAccuracy:false});
    const result=await deadline(new Promise((resolve,reject)=>service.getCurrentPosition((status,value)=>{
      if(status==='complete')resolve(value);else reject(new Error(safeMessage(value?.info||value?.message)));
    })),13000,'高德定位超时');
    const lng=Number(result.position?.getLng?.()??result.position?.lng),lat=Number(result.position?.getLat?.()??result.position?.lat);
    if(!Number.isFinite(lng)||!Number.isFinite(lat)||Math.abs(lng)>180||Math.abs(lat)>90)throw new Error('定位坐标无效');
    const kind=String(result.location_type||'unknown').toLowerCase();
    const source=kind==='ip'?'IP 城市位置':kind==='html5'?'浏览器定位':kind==='sdk'?'SDK 定位':'来源未说明';
    const address=result.addressComponent||{};
    const area=[address.province,address.city,address.district].filter(v=>typeof v==='string'&&v.trim()).join(' ');
    const accuracy=Number(result.accuracy);
    output.textContent=rounded(lng,lat)+`\n来源：${source}`+(area?'\n'+area:'')+
      (kind==='ip'?'\n按城市使用，不计算本人路程':Number.isFinite(accuracy)&&accuracy>0?`\n自报误差约 ${Math.round(accuracy)} 米`:'\n未提供误差范围')+
      `\n耗时 ${((performance.now()-started)/1000).toFixed(1)} 秒`;
  }catch(error){output.textContent='本次未取得高德位置：'+(error?.message||'定位未完成');}
  finally{busy=false;refresh();}
});
cityButton.addEventListener('click',async()=>{
  if(experimentClosed||busy||attempts>=cap)return;
  attempts++;sessionStorage.setItem(budgetKey,String(attempts));busy=true;refresh();
  const output=document.querySelector('#amap-result'),started=performance.now();output.textContent='正在查询网络出口所在城市…';
  const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),10000);
  try{
    const response=await fetch('/api/v1/maps/_AMapService/v3/ip?output=json',{signal:controller.signal,cache:'no-store'});
    if(!response.ok)throw new Error(`城市定位接口未完成（${response.status}）`);
    const result=await response.json();
    if(String(result.status)!=='1')throw new Error(code(result.info));
    const parts=[result.province,result.city].filter(value=>typeof value==='string'&&value.trim());
    if(!parts.length)throw new Error('未返回国内城市信息');
    output.textContent=[...new Set(parts)].join(' ')+`\n来源：网络出口 IP\n仅城市级结果，不作为精确出发点\n耗时 ${((performance.now()-started)/1000).toFixed(1)} 秒`;
  }catch(error){output.textContent='本次未取得城市位置：'+safeMessage(error?.message);}
  finally{clearTimeout(timer);busy=false;refresh();}
});
refresh();
</script>
</html>
