<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RoamBot · 设备定位对比</title>
<style>
  :root { color-scheme:light; font:16px/1.7 system-ui,sans-serif; color:#193e47; background:#edf5f4 }
  * { box-sizing:border-box } body { margin:0; padding:40px 20px }
  main { max-width:760px; margin:8vh auto } h1 { font-size:30px; line-height:1.3 }
  .muted { color:#59747b } .samples { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:16px; margin:30px 0 }
  section { padding:24px; background:#fff; border-radius:22px; border:1px solid #d9e7e7 }
  h2 { font-size:18px; margin-top:0 } button,a { font:inherit; color:inherit }
  button { border:0; background:#dceeed; border-radius:24px; padding:10px 18px; cursor:pointer }
  button:disabled { opacity:.55; cursor:wait } button:focus-visible,a:focus-visible { outline:2px solid #27778a; outline-offset:4px }
  output { display:block; min-height:125px; margin-top:16px; white-space:pre-line; overflow-wrap:anywhere }
  #comparison { padding:16px 0 } @media(max-width:560px) { .samples { grid-template-columns:1fr } main { margin:20px auto } }
</style>
<main>
  <a href="/explore">← 返回推荐</a>
  <h1>设备定位对比</h1>
  <p class="muted">手动切换代理后各获取一次，比较浏览器返回的位置。此页不发起推荐、模型或高德请求；结果仅保留在当前页面。</p>
  <div class="samples">
    <section><h2>开启代理时</h2><button type="button" data-sample="on">获取设备位置</button><output id="on" aria-live="polite">等待获取</output></section>
    <section><h2>关闭代理时</h2><button type="button" data-sample="off">获取设备位置</button><output id="off" aria-live="polite">等待获取</output></section>
  </div>
  <p id="comparison" role="status">两次结果齐全后显示位置差异。</p>
  <p class="muted">显示约 1 千米精度的经纬度供核对，不存储或上传精确坐标。浏览器自身获取位置仍依赖设备或系统定位服务。此页不会开关你的代理。</p>
</main>
<script>
  const samples = {}, buttons = [...document.querySelectorAll('[data-sample]')];
  function compare() {
    if (!samples.on || !samples.off) return;
    const a=samples.on.coords,b=samples.off.coords,r=x=>x*Math.PI/180;
    const h=Math.sin(r(b.latitude-a.latitude)/2)**2+Math.cos(r(a.latitude))*Math.cos(r(b.latitude))*Math.sin(r(b.longitude-a.longitude)/2)**2;
    const km=12742*Math.asin(Math.sqrt(Math.min(1,h)));
    document.querySelector('#comparison').textContent=`两次设备位置相差约 ${km < 1 ? Math.round(km*1000)+' 米' : km.toFixed(1)+' 千米'}。这能帮助判断代理状态是否影响本次定位，不能单凭差异确认哪次位置正确。`;
  }
  for (const button of buttons) button.addEventListener('click',()=>{
    const slot=button.dataset.sample, output=document.getElementById(slot);
    if (!navigator.geolocation) { output.textContent='当前浏览器未提供定位接口。'; return; }
    delete samples[slot]; document.querySelector('#comparison').textContent='两次结果齐全后显示位置差异。';
    buttons.forEach(b=>b.disabled=true); output.textContent='正在获取设备位置…';
    const finish=()=>buttons.forEach(b=>b.disabled=false);
    navigator.geolocation.getCurrentPosition(p=>{
      samples[slot]=p;
      output.textContent=`东经 ${p.coords.longitude.toFixed(2)}°\n北纬 ${p.coords.latitude.toFixed(2)}°\n设备估计误差约 ${Math.round(p.coords.accuracy)} 米\n获取时间 ${new Date(p.timestamp).toLocaleTimeString('zh-CN')}`;
      finish(); compare();
    },e=>{ output.textContent=e.code===1?'未获定位授权。':e.code===3?'获取位置超时。':'设备暂未返回位置。'; finish(); },
      {enableHighAccuracy:true,maximumAge:0,timeout:12000});
  });
</script>
</html>
